name: Build and test
on:
  push:
  pull_request:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config
      - run: zig fmt --check build.zig src
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseSafe
      - name: Package the macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "zig-out/Clipboard Sync.app" "zig-out/Clipboard-Sync-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-sync-${{ runner.os }}-${{ runner.arch }}
          path: |
            zig-out/bin/*
            zig-out/Clipboard-Sync-macOS.zip
